name: Avisos de sesiones
on:
  schedule:
    # Respaldo: GitHub lo corre cuando puede (horas de atraso) y lo apaga tras
    # 60 días sin commits. El disparo confiable es externo: un cron que llama
    # a workflow_dispatch cada 10 min (ver docs/avisos-cron-externo.md).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      ahora:
        description: "Simular este momento (ISO, p. ej. 2026-10-10T12:33:00Z). Vacío = ahora."
        required: false

permissions:
  contents: read

concurrency:
  group: avisos

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Última sesión avisada
      uses: actions/cache/restore@v4
      with:
        path: avisos/ultima.txt
        key: aviso-${{ github.run_id }}
        restore-keys: aviso-
    - run: npm ci --omit=dev
      working-directory: avisos
    - id: enviar
      run: node avisos/enviar.mjs
      env:
        AHORA: ${{ inputs.ahora }}
        VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
    - name: Recordar la sesión avisada
      # always(): si a un celular le falló pero a otro le llegó, igual se recuerda.
      if: always() && steps.enviar.outputs.id != ''
      uses: actions/cache/save@v4
      with:
        path: avisos/ultima.txt
        key: aviso-${{ steps.enviar.outputs.id }}
