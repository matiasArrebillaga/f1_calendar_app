<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161C">
  <title>Calendario F1</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="encabezado" class="top"></header>
  <main id="contenido"><p class="estado">Cargando…</p></main>
  <nav class="tabbar" aria-label="Secciones">
    <span class="indicador" aria-hidden="true"></span>
    <!-- Sólo en la PC (style.css, min-width 1024px): la tabbar es la barra lateral. -->
    <a class="lat-marca" href="#/calendario" aria-label="Ir al calendario"><img src="icon-192.png" alt="" width="28" height="28">F1 CALENDAR</a>
    <div class="lat-anio" id="lat-anio"></div>
    <span class="lat-grupo">MENÚ</span>
    <a data-pestana="calendario" href="#/calendario">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Calendario
    </a>
    <a data-pestana="clasificacion" href="#/clasificacion">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      Clasificación
    </a>
    <a data-pestana="pilotos" href="#/pilotos">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Pilotos
    </a>
    <button class="lat-buscar" type="button" data-buscar>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Buscar <kbd>Ctrl K</kbd>
    </button>
    <div class="lat-atajos"><span><kbd>←</kbd> <kbd>→</kbd> temporada</span><span><kbd>Esc</kbd> volver</span></div>
  </nav>
  <div id="sin-red" class="sin-red" role="status" hidden>
    <span>Sin conexión · mostrando lo último guardado</span>
    <button data-reintentar>Reintentar</button>
  </div>
</body>
</html>
