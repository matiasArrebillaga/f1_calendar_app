name: Calendario_test
on:
  push:
    branches: [ "master" ]
    paths-ignore: [ "web/**", ".github/workflows/pages.yaml" ]
  pull_request:
    branches: [ "master" ]
    paths-ignore: [ "web/**", ".github/workflows/pages.yaml" ]

permissions:
  contents: read

jobs:
  Calendario_test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: pip
    - name: Install Qt system libraries
      # PySide6 las necesita aunque corra offscreen.
      run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt flake8 pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        QT_QPA_PLATFORM: offscreen
      run: pytest
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Avisos (sintaxis)
      # enviar.mjs pega a la red y manda pushes: acá sólo se chequea que parsee.
      run: node --check avisos/enviar.mjs
